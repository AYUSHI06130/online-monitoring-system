<!DOCTYPE html>
<html>

<head>

    <title>Integrity Score Report</title>

</head>

<body>

<h1>Integrity Score Report</h1>

<table border="1">

<tr>

<th>Candidate ID</th>

<th>Session ID</th>

<th>Final Score</th>

<th>Risk Level</th>

<th>Total Events</th>

<th>Calculated At</th>

</tr>

{% for row in scores %}

<tr>

<td>{{ row["candidate_id"] }}</td>

<td>{{ row["session_id"] }}</td>

<td>{{ row["final_score"] }}</td>

<td>{{ row["risk_level"] }}</td>

<td>{{ row["total_events"] }}</td>

<td>{{ row["calculated_at"] }}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
